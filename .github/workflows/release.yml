name: Build, test, and publish stable wheels on PyPI

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The following package versions are pinned to avoid their versions being impacted by
  # the --resolution flag.
  PYTEST_VERSION_SPECIFIER: ">=9,<10"
  PYTHON_SEMANTIC_RELEASE_VERSION_SPECIFIER: ">=10,<11"

jobs:

  check-version:
    name: Check for a version bump
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Check out frozendefaultdict
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Read package version
        id: version
        run: |
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check if the version is already released
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "Tag v${{ steps.version.outputs.version }} already exists, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distributions
    needs: [check-version]
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Check out frozendefaultdict
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
    
      - name: Build frozendefaultdict package
        run: uv build -o ./dist

      - name: Upload wheels artefacts
        uses: actions/upload-artifact@v7
        with:
          name: frozendefaultdict
          path: ./dist/
          retention-days: 1

  test-wheels:
    name: Full test on ${{ matrix.os }} for wheel
    needs: [build]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        dependency-resolution: ['highest', 'lowest-direct']

    runs-on: ${{ matrix.os }}

    steps:
      # Only tests/ and root files: src/ must not shadow the installed wheel.
      - name: Check out tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: tests

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        
      - name: Recover frozendefaultdict distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: frozendefaultdict
          path: ./dist/

      - name: Install the package
        shell: bash
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --resolution ${{ matrix.dependency-resolution }} dist/*.whl "pytest$PYTEST_VERSION_SPECIFIER"

      - name: Check that the package can be imported
        run: uv run --no-sync -- python -c "from frozendefaultdict import frozendefaultdict"

      - name: Run tests
        run: uv run --no-sync pytest tests

  test-sdists:
    name: Minimal test on ubuntu-latest for source build
    needs: [build]

    runs-on: ubuntu-latest

    steps:
      - name: Check out tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: tests

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        
      - name: Recover frozendefaultdict distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: frozendefaultdict
          path: ./dist/

      - name: Install package
        run: |
          uv venv --python 3.11
          uv pip install dist/*.tar.gz "pytest$PYTEST_VERSION_SPECIFIER"

      - name: Check that the package can be imported
        run: uv run --no-sync -- python -c "from frozendefaultdict import frozendefaultdict"

      - name: Run tests
        run: uv run --no-sync pytest tests

  publish:
    name: Publish Python distribution to PyPI
    needs: [test-wheels, test-sdists]

    runs-on: ubuntu-slim
    environment:
      name: pypi
      url: https://pypi.org/p/frozendefaultdict
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        
      - name: Recover frozendefaultdict distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: frozendefaultdict
          path: ./dist/

      - name: Publish distribution to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    name: Tag and create GitHub release
    needs: [check-version, publish]

    runs-on: ubuntu-slim
    permissions:
      contents: write

    env:
      TAG: v${{ needs.check-version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out frozendefaultdict
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create and push tag
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub release with generated notes
        run: uvx --from "python-semantic-release$PYTHON_SEMANTIC_RELEASE_VERSION_SPECIFIER" semantic-release changelog --post-to-release-tag "$TAG"